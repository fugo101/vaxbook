name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go (gen check, lint, test, WASM test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.tool.sum
      - name: Generated code and migrations are up to date
        run: go tool -modfile=go.tool.mod task gen:check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...
      - uses: actions/setup-node@v7 # task test ends with the WASM engine run under Node
        with:
          node-version: '26'
      - name: Test
        run: go tool -modfile=go.tool.mod task test

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vaxbook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
