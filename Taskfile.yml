# Build orchestration (ADR-0001). Tools are pinned in go.tool.mod; run
# `go tool -modfile=go.tool.mod task <name>` if task is not installed.
version: "3"

vars:
  TOOL: go tool -modfile=go.tool.mod
  GOLANGCI_LINT_VERSION: v2.15.0
  IMAGE: vaxbook:dev

env:
  # testcontainers needs the Docker socket. Docker contexts that do not use
  # /var/run/docker.sock (OrbStack, Colima, rootless) are picked up here.
  DOCKER_HOST:
    sh: echo "${DOCKER_HOST:-$(docker context inspect --format '{{"{{"}}.Endpoints.docker.Host{{"}}"}}' 2>/dev/null)}"

tasks:
  default:
    cmds: ["{{.TASK_EXE}} --list"]
    silent: true

  gen:
    desc: Regenerate code from contracts/openapi.yaml and the ent schema
    cmds:
      - go generate ./apps/api/internal/httpapi/ ./apps/api/internal/store/ent/

  migrate:diff:
    desc: Write a goose migration for ent schema changes (task migrate:diff NAME=add_profiles)
    requires:
      vars: [NAME]
    cmds:
      - go run ./apps/api/internal/store/migrategen -name {{.NAME}}

  gen:check:
    desc: Fail if generated code or migrations are out of date (CI)
    cmds:
      - task: gen
      - git diff --exit-code --stat -- apps/ contracts/ go.mod go.sum
      - test -z "$(git status --porcelain -- apps/ contracts/)" || (git status --porcelain -- apps/ contracts/; echo "untracked generated files"; exit 1)
      - go run ./apps/api/internal/store/migrategen -check

  test:
    desc: Run Go tests (needs Docker for Postgres), then the WASM engine run (needs Node)
    cmds:
      - go test -race -count=1 ./... {{.CLI_ARGS}}
      - task: test:wasm

  test:wasm:
    desc: Run the engine and ruleset tests under js/wasm with Node and log the WASM size
    env:
      GOOS: js
      GOARCH: wasm
    vars:
      # wasm_exec caps argv plus environment at 8 KB, which a developer shell
      # or a CI runner can exceed, so the test binary gets PATH (for Node) only.
      WASM_EXEC:
        sh: echo "env -i 'PATH=$(dirname "$(command -v node)"):/usr/bin:/bin' '$(go env GOROOT)/lib/wasm/go_js_wasm_exec'"
    preconditions:
      - sh: command -v node
        msg: test:wasm needs Node 26 on PATH (README › Backend development)
    cmds:
      # The entry point is js-tagged, so the native vet never sees it (lint:wasm
      # covers lint).
      - go vet ./engine/wasm/...
      - go test -count=1 -exec="{{.WASM_EXEC}}" ./engine/... ./ruleset/...
      # Built outside the repo so gen:check never sees a stray file.
      - |
        dir=$(mktemp -d)
        go build -trimpath -ldflags="-s -w" -o "$dir/engine.wasm" ./engine/wasm
        raw=$(wc -c < "$dir/engine.wasm" | tr -d ' ')
        gz=$(gzip -9 -c "$dir/engine.wasm" | wc -c | tr -d ' ')
        rm -rf "$dir"
        line="engine.wasm: $raw bytes, $gz bytes gzip"
        echo "$line"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "$line" >> "$GITHUB_STEP_SUMMARY"; fi

  lint:
    desc: Run golangci-lint natively, then on engine/ and ruleset/ as js/wasm
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...
      - task: lint:wasm

  lint:wasm:
    desc: Run golangci-lint on engine/ and ruleset/ as js/wasm (CI runs the same pass through the action)
    cmds:
      # golangci-lint loads only the files of the platform it runs for, so the
      # js-tagged entry point needs its own pass for depguard's stdlib-only
      # rule. -exec gives the target to the linter, not to the build of it.
      - go run -exec "env GOOS=js GOARCH=wasm" github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./engine/... ./ruleset/...

  build:
    desc: Build the vaxbook binary into dist/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/vaxbook ./apps/api/cmd/vaxbook

  db:up:
    desc: Start the local dev Postgres
    dotenv: [.env.dev] # VAXBOOK_DEV_DB_PORT; task-level dotenv does not reach deps
    cmds:
      - docker compose -f compose.dev.yaml up -d --wait

  db:down:
    desc: Stop the local dev Postgres (keeps data; add -- -v to drop it)
    dotenv: [.env.dev]
    cmds:
      - docker compose -f compose.dev.yaml down {{.CLI_ARGS}}

  run:
    desc: Run the server against the dev Postgres, with settings from .env.dev
    deps: [db:up]
    dotenv: [.env.dev]
    cmds:
      - go run ./apps/api/cmd/vaxbook

  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t {{.IMAGE}} .
