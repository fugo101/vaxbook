name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go (gen check, lint, test, WASM test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Generated code and migrations are up to date
        run: go tool -modfile=tools/go.mod task gen:check
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          args: ./...
      - name: golangci-lint (engine and ruleset as js/wasm)
        # Lint sees only the host platform's files; this pass covers the
        # js-tagged WASM entry point (Taskfile lint:wasm).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: js
          GOARCH: wasm
        with:
          version-file: .golangci-lint-version
          args: ./engine/... ./ruleset/...
      - uses: actions/setup-node@v7 # task test ends with the WASM engine run under Node
        with:
          node-version: '26'
      - name: Test
        run: go tool -modfile=tools/go.mod task test

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: vaxbook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
