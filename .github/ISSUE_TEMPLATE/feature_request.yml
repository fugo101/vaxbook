name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before you start work on an engine, rule set or catalog change, so the approach can be agreed first. Check `docs/feature-spec-mvp.md` and the open issues to avoid duplicates.

        Do not paste real vaccination records or other personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like VaxBook to do? Alternatives you considered are welcome too.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: For catalog or rule data, cite the Source document and the article, clause or page. Leave empty otherwise.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: This issue contains no personal health data or other personal data.
          required: true
