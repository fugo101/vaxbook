name: Freshness
# Dependabot does not track golangci-lint (.golangci-lint-version) or the Node
# major (ci.yml node-version). This opens, or updates, one issue when either
# falls behind.
on:
  schedule:
    - cron: '0 23 * * 0' # Monday 06:00 Asia/Ho_Chi_Minh, as Dependabot
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  freshness:
    name: Pinned versions are current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare pins with the latest releases
        run: |
          set -euo pipefail
          title='Pinned tool versions are behind: golangci-lint or Node LTS'
          behind=()

          pinned_lint=$(tr -d '[:space:]' < .golangci-lint-version)
          latest_lint=$(gh api repos/golangci/golangci-lint/releases/latest --jq .tag_name)
          [[ "$pinned_lint" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$latest_lint" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::unexpected golangci-lint version: pinned '$pinned_lint', latest '$latest_lint'"; exit 1; }
          if [ "$pinned_lint" != "$latest_lint" ] && [ "$(printf '%s\n%s\n' "$pinned_lint" "$latest_lint" | sort -V | tail -n1)" = "$latest_lint" ]; then
            behind+=("- golangci-lint: \`.golangci-lint-version\` is $pinned_lint, latest release is $latest_lint. Edit that one file; the Taskfile and CI both read it.")
          fi

          pinned_node=$(sed -nE "s/.*node-version: '([0-9]+)'.*/\1/p" .github/workflows/ci.yml | head -n1)
          latest_node=$(curl -fsS --retry 3 https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.lts != false)][0].version | ltrimstr("v") | split(".")[0]')
          [[ "$pinned_node" =~ ^[0-9]+$ && "$latest_node" =~ ^[0-9]+$ ]] \
            || { echo "::error::unexpected Node major: pinned '$pinned_node', latest LTS '$latest_node'"; exit 1; }
          if [ "$latest_node" -gt "$pinned_node" ]; then
            behind+=("- Node: \`ci.yml\` uses major $pinned_node, the latest LTS major is $latest_node. Bump \`node-version\` in \`ci.yml\` and the Node mention in the Taskfile \`test:wasm\` precondition and README (\`TestNodeVersionAgrees\` checks the first two).")
          fi

          if [ "${#behind[@]}" -eq 0 ]; then
            echo "golangci-lint $pinned_lint and Node $pinned_node are current"
            exit 0
          fi

          body=$(printf 'Found by the Freshness workflow. No bot tracks these two pins.\n\n%s\n\nThe weekly run keeps this list current while the issue is open. Close it once the pins are bumped; the next run opens a new one if something falls behind again.\n' "$(printf '%s\n' "${behind[@]}")")

          # Match the title across all open issues, whatever their labels:
          # triage replaces needs-triage, so a label filter would miss an issue
          # the owner has already triaged and open a duplicate every week. The
          # plain list avoids the search index and its fuzzy matching.
          existing=$(gh issue list --state open --limit 1000 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --label needs-triage --body "$body"
            exit 0
          fi

          # The title names both pins, so an open issue may list only the one
          # that was behind when it was opened. Bring its body up to date so a
          # second pin that falls behind later is not hidden.
          current=$(gh issue view "$existing" --json body --jq .body | tr -d '\r')
          if [ "$current" = "$body" ]; then
            echo "open issue #$existing already reports this; nothing to update"
          else
            gh issue edit "$existing" --body "$body"
            echo "updated open issue #$existing"
          fi
