openapi: 3.1.0
info:
  title: VaxBook API
  version: 0.1.0
  description: |
    User-facing API of VaxBook, served on the app host under `/api/v1`.
    This file is the source of truth (SAD §8): Go and TypeScript code is generated from it.

    Conventions:
    - Errors use `application/problem+json` (RFC 9457).
    - Every write request must carry the header `X-VaxBook-CSRF: 1` (SAD §8).
    - Authenticated operations declare the `session` security scheme; the
      `__Host-session` cookie is set by `POST /auth/otp/verify` (ADR-0010).
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: me

paths:
  /auth/otp:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a sign-in code to an email address.
      description: |
        Always answers 202, whether or not the email already has an account, so the
        endpoint cannot be used to discover registered emails. A new code invalidates
        any earlier pending code for the same email.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: A code was sent, if the address can receive mail.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Exchange a sign-in code for a session.
      description: |
        Sign-up and sign-in are one flow: the account is created on the first
        successful verification. Wrong, expired and unknown codes all get the same 400.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The `__Host-session` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session immediately.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the `__Host-session` cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in account.
      security:
        - session: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session

  parameters:
    Csrf:
      name: X-VaxBook-CSRF
      in: header
      required: true
      description: Must be `1` on every write request (SAD §8).
      schema:
        type: string
        const: "1"

  schemas:
    OtpRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Decode as a plain string so the server sees exactly what was sent and
          # validates it itself (the generated Email type silently rewrites
          # "Name <a@b.c>" to "a@b.c").
          x-go-type: string

    OtpVerify:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          # Decode as a plain string so the server sees exactly what was sent and
          # validates it itself (the generated Email type silently rewrites
          # "Name <a@b.c>" to "a@b.c").
          x-go-type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"

    Me:
      type: object
      additionalProperties: false
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type, or `about:blank`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Try again later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
